name: CI/CD Pipeline (Automated Quality Gates)

# Trigger workflow on any push or pull request to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Concurrency group: cancel previous in-progress runs for the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BACKEND CODE QUALITY & LINTING
  # ============================================================================
  backend-lint:
    name: Backend Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          ruff check backend/ --select=E9,F63,F7,F82
          # Print style warnings without breaking build
          ruff check backend/ --exit-zero

  # ============================================================================
  # 2. BACKEND AUTOMATED TESTING (MATRIX)
  # ============================================================================
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Automated Pytest Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./data/test.db
          AUTH_SECRET_KEY: ci-test-secret-key-for-github-actions
          GEMINI_API_KEY: mock-ci-test-key
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          # Set PYTHONPATH to project root and run pytest with coverage
          python -m pytest tests/ -v

  # ============================================================================
  # 3. FRONTEND BUILD & VALIDATION
  # ============================================================================
  frontend-build:
    name: Frontend Build & Asset Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: |
          npm ci --prefer-offline || npm install

      - name: Compile Production Vite Bundle
        working-directory: frontend
        run: |
          npm run build

  # ============================================================================
  # 4. DOCKER BUILD VERIFICATION
  # ============================================================================
  docker-validation:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: llm-dpeci-backend:ci-test

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: llm-dpeci-frontend:ci-test
